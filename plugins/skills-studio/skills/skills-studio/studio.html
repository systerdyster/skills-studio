<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Studio</title>
<style>
:root {
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #efefec; --line: #d9d9d4; --text: #1d1d1b;
  --muted: #6b6b66; --accent: #3b5bdb; --accent-text: #ffffff;
  --error: #c92a2a; --warning: #b7791f; --info: #3b5bdb; --readonly: #f0efea;
  --project: #2b8a3e; --user: #6741d9; --synced: #0c8599; --plugin: #a61e4d;
  --listing-bg: #eef2ff; --listing-edge: #bac8ff; --band: #f7f7f4; --band-edge: #e6e6e1;
  --heading: #2f4ac0; --code-bg: #fff4e0; --code-text: #8a4b00; --pre-bg: #f3f1ea; --zebra: #f6f6f2;
  --quote-bg: #eef2ff; --marker: #5c7cfa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #20201e; --surface-2: #2a2a27; --line: #3a3a36; --text: #ecece8;
    --muted: #9b9b94; --accent: #748ffc; --accent-text: #10111a;
    --error: #ff6b6b; --warning: #f0b44c; --info: #748ffc; --readonly: #262624;
    --project: #69db7c; --user: #b197fc; --synced: #66d9e8; --plugin: #f783ac;
    --listing-bg: #1d2238; --listing-edge: #34406e; --band: #252523; --band-edge: #33332f;
    --heading: #91a7ff; --code-bg: #3a2c16; --code-text: #ffc078; --pre-bg: #1a1a18; --zebra: #262624;
    --quote-bg: #1f2438; --marker: #91a7ff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--error); }
button.danger:hover { border-color: var(--error); }
input, textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { resize: vertical; min-height: 70px; }
code, pre { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }

header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font-size: 15px; margin: 0; }
header .project { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 120px; direction: rtl; text-align: left; }
header .counts { display: flex; gap: 8px; color: var(--muted); white-space: nowrap; align-items: center; }

main { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }
aside { background: var(--surface); overflow: auto; min-height: 0; }
#palette { border-right: 1px solid var(--line); padding: 12px; }
#panel { width: min(1080px, calc(100vw - 48px)); max-height: 92vh; padding: 0; border: 1px solid var(--line); border-radius: 12px;
         background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgb(0 0 0 / .25); overflow: hidden; }
#panel::backdrop { background: rgb(0 0 0 / .35); }
#panel { height: 92vh; }
#panel .body { display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: 92vh; height: 100%; }
#panel .head { padding: 20px 32px 14px; border-bottom: 1px solid var(--line); background: var(--band); }
#panel .head-actions { float: right; display: flex; gap: 8px; margin-left: 12px; }
#panel .page { padding: 4px 32px 32px; overflow: auto; }
#panel .md { font-size: 15px; max-width: 880px; }
#panel .fields label:first-child { margin-top: 12px; }
#panel textarea.source { font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 10px; min-height: 360px; tab-size: 2; }
#panel .inline-form { display: flex; gap: 8px; margin-top: 4px; }
#panel .inline-form > :first-child { flex: 1; min-width: 0; }
#panel .inline-form button { white-space: nowrap; }
.ref { border-radius: 5px; padding: 0 3px; cursor: pointer; white-space: nowrap; }
.ref.call { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.ref.mention { color: var(--text); outline: 1px dashed var(--muted); outline-offset: -1px; }
.ref.broken { color: var(--error); outline: 1px dashed var(--error); outline-offset: -1px; cursor: help; }
.ref code { background: none; padding: 0; color: inherit; }
.ref:hover { filter: brightness(1.1); text-decoration: underline; }
#panel .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; margin-top: 8px; }
#panel .head ul.findings { margin: 6px 0 0; font-size: 13px; }
#panel .file { margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--line); }
.md { line-height: 1.6; padding-top: 6px; }
.md :is(h1, h2, h3, h4, h5, h6) { text-transform: none; letter-spacing: 0; color: var(--heading); margin: 22px 0 6px; line-height: 1.3; }
#panel .md h1 { font-size: 20px; color: var(--text); }
#panel .md h2 { font-size: 16.5px; }
#panel .md h3 { font-size: 14.5px; }
#panel .md :is(h4, h5, h6) { font-size: 13.5px; color: var(--muted); }
.md .band { background: var(--band); border: 1px solid var(--band-edge); border-left: 3px solid var(--heading);
            border-radius: 0 8px 8px 0; padding: 2px 18px 8px; margin: 14px 0; }
.md .band:nth-of-type(even) { background: var(--surface); }
.md .band > :first-child { margin-top: 12px; }
.md p { margin: 8px 0; }
.md strong { color: var(--text); font-weight: 650; }
.md :is(ul, ol) { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--marker); font-weight: 600; }
.md li.task { list-style: none; margin-left: -18px; }
.md code { background: var(--code-bg); color: var(--code-text); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
#panel .md pre { margin: 10px 0; background: var(--pre-bg); border: 1px solid var(--band-edge); }
.md pre code { background: none; color: var(--text); padding: 0; }
.md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--accent); background: var(--quote-bg); border-radius: 0 6px 6px 0; }
.md table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
.md :is(th, td) { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--listing-bg); color: var(--heading); }
.md tbody tr:nth-child(even) { background: var(--zebra); }
.md hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.md .link { color: var(--accent); text-decoration: underline dotted; }
#panel .part { margin-top: 18px; }
#panel .part + .part { margin-top: 30px; }
#panel .part-rule { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
#panel .part-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text); }
#panel .part-hint { color: var(--muted); font-size: 12px; flex: 1 1 200px; }
#panel .part-cost { color: var(--muted); font-size: 12px; white-space: nowrap; }
#panel .part-cost .over { color: var(--warning); font-weight: 600; }
#panel .listing { background: var(--listing-bg); border: 1px solid var(--listing-edge); border-radius: 8px; padding: 12px 16px; margin-top: 10px; }
#panel .listing dt { color: var(--muted); }
#panel .listing .description { margin: 2px 0; }
#panel .listing dl { margin-top: 8px; font-size: 12.5px; }
#panel .danger-zone { margin-top: 28px; padding-top: 4px; border-top: 1px solid var(--line); }
#panel .danger-zone .row { justify-content: space-between; align-items: center; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.tabs button { padding: 2px 8px; font-size: 12px; }
.tabs button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--text); }
#palette ul { list-style: none; margin: 0; padding: 0; }
#palette li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
#palette li:hover { background: var(--surface-2); }
#palette li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#palette .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.project { background: var(--project); } .dot.user { background: var(--user); }
.dot.synced { background: var(--synced); } .dot.plugin { background: var(--plugin); }
.badge { font-size: 11px; border-radius: 9px; padding: 0 6px; border: 1px solid currentColor; white-space: nowrap; }
.badge.error { color: var(--error); } .badge.warning { color: var(--warning); } .badge.info { color: var(--info); }

#cards { overflow: auto; min-height: 0; padding: 16px; columns: 300px; column-gap: 14px; }
#cards > .card { break-inside: avoid; margin-bottom: 14px; }
#empty { color: var(--muted); text-align: center; padding: 48px 24px; column-span: all; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.card .card { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.card .card .card { background: var(--surface); }
.card .card .card .card { background: var(--surface-2); }
.card.readonly { border-style: dashed; }
.card.unused > .card-head { opacity: .55; }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-head { display: flex; gap: 6px; align-items: center; cursor: pointer; min-width: 0; }
.card-head .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .meta { color: var(--muted); font-size: 12px; white-space: nowrap; margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-head .toggle { border: none; background: none; padding: 0 2px; color: var(--muted); font-size: 12px; }
.card .summary { color: var(--muted); font-size: 12.5px; margin: 3px 0 0 14px; display: -webkit-box; -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 9px; padding: 0 7px; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.chip.broken { border-style: dashed; border-color: var(--error); color: var(--error); cursor: default; }
.chip.pending { border-style: dotted; border-color: var(--accent); color: var(--accent); cursor: default; }
.loop { color: var(--muted); font-size: 12px; margin-top: 8px; }

#panel h2 { font-size: 16px; margin: 0 0 2px; word-break: break-word; }
#panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
#panel .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
#panel dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 13px; }
#panel dt { color: var(--muted); }
#panel dd { margin: 0; }
#panel ol, #panel ul.findings { margin: 0; padding-left: 20px; }
#panel ul.findings li { margin-bottom: 4px; }
#panel pre { background: var(--surface-2); padding: 12px; border-radius: 6px; margin: 16px 0 0; white-space: pre-wrap; word-break: break-word; }
#panel label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
#panel .row { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }

main.closed { display: grid; place-items: center; text-align: center; grid-template-columns: 1fr; padding: 24px; }
main.closed h1 { font-size: 20px; margin: 0 0 8px; }
main.closed .sub { color: var(--muted); }

#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
#toast.shown { opacity: 1; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 180px 1fr; }
  #palette { border-right: none; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1>Skills Studio</h1>
  <span class="project" id="project"></span>
  <span class="counts" id="counts"></span>
  <button id="usage">Refresh usage</button>
  <button id="new-skill">New skill</button>
  <button id="analyse" class="primary">Analyse</button>
  <button id="close-studio" title="Stop the studio and let Claude stop watching for tasks">Close studio</button>
</header>
<main id="main">
  <aside id="palette">
    <input id="search" type="search" placeholder="Find a skill" aria-label="Find a skill">
    <div class="tabs" id="tabs"></div>
    <ul id="palette-list"></ul>
    <p class="hint">Each card holds the skills it calls, in order; what it only mentions is listed at its foot. Click a skill to open it.</p>
  </aside>
  <section id="cards" aria-label="Skills"></section>
</main>
<dialog id="panel" aria-label="Skill"><div class="body" id="panel-body"></div></dialog>
<div id="toast" role="status"></div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const SOURCES = ["project", "user", "synced", "plugin"];
const POLL_MS = 4000;

const state = { graph: null, tasks: [], usage: { status: "idle", skills: {} }, signature: "", tab: "project", selected: null, editing: null };
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const options = { headers: { "X-Studio-Token": TOKEN } };
  if (body !== undefined) {
    options.method = "POST";
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
  return data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== undefined) node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false)
    node.append(child instanceof Node ? child : String(child));
  return node;
}

let toastTimer;
function toast(text) {
  const box = $("toast");
  box.textContent = text;
  box.classList.add("shown");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove("shown"), 3200);
}

async function sendTask(task, said) {
  try {
    await api("/task", task);
    toast(`Sent to Claude: ${said}`);
    refresh(true);
    return true;
  } catch (error) {
    toast(`Not sent: ${error.message}`);
    return false;
  }
}

// ---- graph helpers -------------------------------------------------------------------------

const skillById = (id) => state.graph.skills.find((s) => s.id === id);
const findingsFor = (id) => state.graph.findings.filter((f) => f.skill === id);
const wiresFrom = (id) => state.graph.wires.filter((w) => w.from === id).sort((a, b) => a.order - b.order);
const wiresTo = (id) => state.graph.wires.filter((w) => w.to === id);
// A wire not judged yet counts as a call, as the flows do.
const callsFrom = (id) => wiresFrom(id).filter((w) => !w.broken && w.kind !== "mention");
const mentionsFrom = (id) => wiresFrom(id).filter((w) => w.broken || w.kind === "mention");
const usageOf = (id) => state.usage.skills?.[id];
const neverUsed = (id) => usageOf(id)?.uses === 0;
const unjudged = () => state.graph.wires.filter((w) => !w.broken && !w.kind && skillById(w.from)?.source === "project").length;
const pendingFrom = (id) => state.tasks.filter((t) => (t.kind === "link" || t.kind === "unlink") && t.from === id);

function signature(graph) {
  return JSON.stringify([graph.skills.map((s) => [s.id, s.modified]), graph.wires.map((w) => [w.from, w.to, w.broken, w.kind])]);
}

// ---- cards ---------------------------------------------------------------------------------

// The top level: each flow's entry — a project skill nothing calls, or the first of a loop that only
// calls itself. Everything else sits inside the cards that call it.
function topLevel() {
  return state.graph.flows.map((flow) => flow.entry[0]).sort((a, b) => a.localeCompare(b));
}

// The description's first sentence — what the skill does, before its "Use when…" triggers.
function summaryOf(skill) {
  const text = (skill.frontmatter?.description || "").trim();
  const first = text.match(/^.+?[.!?](?=\s|$)/s);
  return (first ? first[0] : text).replace(/\s+/g, " ");
}

function cardHead(id, extra = null) {
  const skill = skillById(id);
  const used = usageOf(id);
  const worst = ["error", "warning", "info"].find((level) => findingsFor(id).some((f) => f.level === level));
  return el("div", { class: "card-head", title: skill.frontmatter?.description || id, onclick: (event) => { event.stopPropagation(); openSkill(id); } },
    el("span", { class: `dot ${skill.source}` }),
    el("span", { class: "name" }, skill.source === "project" ? skill.name : id),
    el("span", { class: "meta" },
      used ? el("span", { title: used.uses ? `Last used ${used.last_used}` : "Never used" }, `${used.uses}×`) : null,
      worst ? el("span", { class: `badge ${worst}` }, worst) : null,
      extra));
}

// A skill's card: the skills it calls nested inside in call order, its mentions as chips. A skill
// shown in full once is collapsed where it appears again, and can be opened in place. A read-only
// skill is a leaf: only the project's own wires are judged, so its insides would be guesses.
function card(id, path, shown) {
  const skill = skillById(id);
  if (!skill.writable) {
    return el("div", { class: `card readonly${state.selected === id ? " selected" : ""}`, "data-id": id }, cardHead(id));
  }
  const classes = ["card", skill.writable ? "" : "readonly", neverUsed(id) ? "unused" : "", state.selected === id ? "selected" : ""];
  const node = el("div", { class: classes.filter(Boolean).join(" "), "data-id": id });
  if (shown.has(id)) {
    const open = el("button", { class: "toggle", title: "Shown in full elsewhere; open it here", onclick: (event) => {
      event.stopPropagation();
      node.replaceWith(card(id, path, new Set()));
    } }, "▸");
    node.append(cardHead(id, open));
    return node;
  }
  shown.add(id);
  node.append(cardHead(id));
  const summary = summaryOf(skill);
  if (summary) node.append(el("div", { class: "summary" }, summary));
  for (const wire of callsFrom(id)) {
    if (!skillById(wire.to)) continue;
    if (path.includes(wire.to) || wire.to === id) node.append(el("div", { class: "loop", title: wire.reason || "" }, `↺ ${wire.to} (loop)`));
    else node.append(card(wire.to, [...path, id], shown));
  }
  const chips = [
    ...mentionsFrom(id).map((wire) => wire.broken
      ? el("span", { class: "chip broken", title: "Named, but no such skill is in scope" }, wire.to)
      : el("span", { class: "chip", title: wire.reason || "", onclick: (event) => { event.stopPropagation(); openSkill(wire.to); } }, wire.to)),
    ...pendingFrom(id).map((task) => el("span", { class: "chip pending", title: "Sent to Claude, not in the text yet" },
      `${task.kind === "link" ? "+" : "−"} ${task.to}`)),
  ];
  if (chips.length) node.append(el("div", { class: "chips" }, "mentions", ...chips));
  return node;
}

function drawCards() {
  const shown = new Set();
  const cards = topLevel().map((id) => card(id, [], shown));
  $("cards").replaceChildren(...(cards.length ? cards : [el("div", { id: "empty" },
    el("p", {}, el("strong", {}, "This project has no skills of its own yet.")),
    el("p", {}, "Create one with ", el("em", {}, "New skill"), ", or open a skill in the palette and copy it into the project."))]));
}

// ---- palette -------------------------------------------------------------------------------

function drawTabs() {
  $("tabs").replaceChildren(...SOURCES.map((source) => {
    const count = state.graph.skills.filter((s) => s.source === source).length;
    return el("button", { "aria-pressed": String(state.tab === source), onclick: () => { state.tab = source; drawPalette(); } },
      `${source} ${count}`);
  }));
}

function drawPalette() {
  drawTabs();
  const query = $("search").value.trim().toLowerCase();
  const list = state.graph.skills
    .filter((s) => s.source === state.tab)
    .filter((s) => !query || s.id.toLowerCase().includes(query) || (s.frontmatter?.description || "").toLowerCase().includes(query))
    .sort((a, b) => a.id.localeCompare(b.id));
  $("palette-list").replaceChildren(...list.map((skill) => {
    const worst = ["error", "warning", "info"].find((level) => findingsFor(skill.id).some((f) => f.level === level));
    return el("li", { title: skill.frontmatter?.description || "", onclick: () => openSkill(skill.id) },
      el("span", { class: `dot ${skill.source}` }), el("span", { class: "name" }, skill.id),
      worst ? el("span", { class: `badge ${worst}` }, worst) : null);
  }));
}

$("search").addEventListener("input", drawPalette);

// ---- markdown ------------------------------------------------------------------------------

// Enough markdown to read a skill: headings, paragraphs, nested lists, tables, fenced code, quotes,
// rules, and inline code, bold, italic and links. Every piece of text is escaped before any tag is
// added, so a skill's text can never become markup; links are shown, not followed.
const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function inline(text) {
  const codes = [];
  let html = text.replace(/`([^`]+)`/g, (_, code) => `\u0000${codes.push(code) - 1}\u0000`);
  html = escapeHtml(html)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => `<span class="link" title="${url}">${label}</span>`)
    .replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`)
    .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)|(^|\W)_(?!\s)(.+?)_(?!\w)/g, (_, p1, a, p2, b) => `${p1 ?? p2}<em>${a ?? b}</em>`);
  return html.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${escapeHtml(codes[n])}</code>`);
}

const LIST_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const TABLE_RULE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const BLOCK_START = /^(```|#{1,6}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/;

function cells(line) {
  return line.trim().replace(/^\||\|$/g, "").split("|").map((cell) => inline(cell.trim()));
}

function list(items) {
  const html = [];
  const open = [];
  for (const { indent, ordered, text } of items) {
    while (open.length && indent < open.at(-1).indent) html.push(`</li></${open.pop().tag}>`);
    if (!open.length || indent > open.at(-1).indent) {
      const tag = ordered ? "ol" : "ul";
      open.push({ indent, tag });
      html.push(`<${tag}>`);
    } else {
      html.push("</li>");
    }
    const task = text.match(/^\[([ xX])\]\s+(.*)$/);
    html.push(task ? `<li class="task"><span class="box">${task[1].trim() ? "☑" : "☐"}</span> ${inline(task[2])}` : `<li>${inline(text)}`);
  }
  while (open.length) html.push(`</li></${open.pop().tag}>`);
  return html.join("");
}

function markdownHtml(source) {
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  const html = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (!line.trim()) { i += 1; continue; }
    if (line.startsWith("```")) {
      const code = [];
      for (i += 1; i < lines.length && !lines[i].startsWith("```"); i += 1) code.push(lines[i]);
      i += 1;
      html.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*?)\s*#*$/);
    if (heading) {
      html.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
      i += 1;
      continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { html.push("<hr>"); i += 1; continue; }
    if (line.startsWith(">")) {
      const quoted = [];
      for (; i < lines.length && lines[i].startsWith(">"); i += 1) quoted.push(lines[i].replace(/^>\s?/, ""));
      html.push(`<blockquote>${markdownHtml(quoted.join("\n"))}</blockquote>`);
      continue;
    }
    if (line.trim().startsWith("|") && TABLE_RULE.test(lines[i + 1] || "")) {
      const head = cells(line);
      const rows = [];
      for (i += 2; i < lines.length && lines[i].trim().startsWith("|"); i += 1) rows.push(cells(lines[i]));
      html.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
        rows.map((row) => `<tr>${row.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (LIST_ITEM.test(line)) {
      const items = [];
      for (; i < lines.length; i += 1) {
        const item = lines[i].match(LIST_ITEM);
        if (item) items.push({ indent: item[1].length, ordered: /\d/.test(item[2]), text: item[3] });
        else if (lines[i].trim() && /^\s+/.test(lines[i]) && items.length) items.at(-1).text += ` ${lines[i].trim()}`;
        else break;
      }
      html.push(list(items));
      continue;
    }
    const paragraph = [];
    for (; i < lines.length && lines[i].trim() && !(paragraph.length && BLOCK_START.test(lines[i])); i += 1) paragraph.push(lines[i].trim());
    html.push(`<p>${inline(paragraph.join(" "))}</p>`);
  }
  return html.join("\n");
}

// Each `##` section becomes a band of its own, so a long skill reads in blocks rather than one wall.
function markdown(source) {
  const box = document.createElement("div");
  box.innerHTML = markdownHtml(source);
  const nodes = [];
  let band = null;
  for (const node of [...box.childNodes]) {
    if (node.nodeName === "H1") band = null;
    if (node.nodeName === "H2") {
      band = el("section", { class: "band" });
      nodes.push(band);
    }
    if (band) band.append(node);
    else nodes.push(node);
  }
  return nodes;
}

// ---- the skill panel -----------------------------------------------------------------------

// A skill opens in a dialog over the cards: one page, read as it is or edited in place. A redraw
// of the same page keeps its scroll place; one with unsaved edits is never redrawn.
function showPanel({ key, title, sub = null, facts = [], actions = [], content }) {
  const body = $("panel-body");
  const same = $("panel").open && body.dataset.key === key;
  const scrolled = same ? body.querySelector(".page")?.scrollTop || 0 : 0;
  body.dataset.key = key;
  body.replaceChildren(
    el("div", { class: "head" },
      el("div", { class: "head-actions" }, actions, el("button", { class: "close", onclick: closePanel, "aria-label": "Close" }, "×")),
      el("h2", {}, title), sub ? el("div", { class: "sub" }, sub) : null, facts),
    el("div", { class: "page" }, content));
  if (!$("panel").open) $("panel").showModal();
  body.querySelector(".page").scrollTop = scrolled;
}

const editsUnsaved = () => state.editing && state.editing.dirty();

function closePanel() {
  if (editsUnsaved() && !confirm("Close without saving your edits?")) return;
  $("panel").close();
}

$("panel").addEventListener("cancel", (event) => {
  if (editsUnsaved() && !confirm("Close without saving your edits?")) event.preventDefault();
});

$("panel").addEventListener("close", () => {
  state.selected = null;
  state.editing = null;
  drawCards();
});

$("panel").addEventListener("click", (event) => {
  if (event.target === $("panel")) closePanel();
});

// ---- skill names in the text ----------------------------------------------------------------

// Marks every skill a text names, as the wires read it: a call solid, a mention dashed, a name with
// no skill behind it red. Hovering says which and why; clicking opens that skill. A one-word name
// counts only as code (`commit`) or a /command; longer names count anywhere outside code blocks.
function markReferences(container, id) {
  const wires = new Map(wiresFrom(id).map((wire) => [wire.to, wire]));
  const byName = new Map();
  for (const wire of wires.values()) {
    const skill = skillById(wire.to);
    byName.set(wire.to, wire);
    if (skill && skill.source === "project" && skill.folder) byName.set(skill.folder, wire);
  }
  if (!byName.size) return;
  const chip = (text, wire) => {
    const kind = wire.broken ? "broken" : wire.kind === "mention" ? "mention" : "call";
    const why = wire.broken ? "No skill by this name is in scope" : `${kind}${wire.reason ? ` — ${wire.reason}` : wire.kind ? "" : " (not judged yet)"}`;
    return el("span", { class: `ref ${kind}`, title: why, onclick: () => !wire.broken && openSkill(wire.to) }, text);
  };
  for (const code of container.querySelectorAll("code")) {
    if (code.closest("pre")) continue;
    const wire = byName.get(code.textContent.replace(/^\//, "").split(/\s/)[0]);
    if (wire) code.replaceWith(chip(code.cloneNode(true), wire));
  }
  const long = [...byName.keys()].filter((name) => /[-:]/.test(name)).sort((a, b) => b.length - a.length);
  if (!long.length) return;
  const pattern = new RegExp(`(?<![\\w:/-])/?(${long.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w-])`, "g");
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode: (node) => node.parentElement.closest("code, pre, .ref") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  for (const node of texts) {
    const parts = node.textContent.split(pattern);
    if (parts.length === 1) continue;
    node.replaceWith(...parts.map((piece, n) => n % 2 ? chip(piece, byName.get(piece)) : piece));
  }
}

function callPicker(skill) {
  const named = new Set(wiresFrom(skill.id).map((w) => w.to));
  const options = state.graph.skills.filter((s) => s.id !== skill.id && !named.has(s.id)).sort((a, b) => a.id.localeCompare(b.id));
  const pick = el("select", { "aria-label": "Skill to call" }, el("option", { value: "" }, "Choose a skill…"),
    options.map((s) => el("option", { value: s.id }, s.id)));
  return el("div", { class: "inline-form" }, pick, el("button", { onclick: () => pick.value &&
    sendTask({ kind: "link", from: skill.id, to: pick.value }, `let ${skill.id} call ${pick.value}`) }, "Ask Claude to add the call"));
}

async function openSkill(id) {
  if (state.editing && state.editing.id !== id) {
    if (state.editing.dirty() && !confirm("Leave without saving your edits?")) return;
    state.editing = null;
  }
  state.selected = id;
  drawCards();
  let skill;
  try {
    skill = await api(`/skill?id=${encodeURIComponent(id)}`);
  } catch (error) {
    return toast(error.message);
  }
  if (state.selected !== id) return;
  const findings = findingsFor(id);
  const facts = [
    el("div", { class: "facts" }, ...usageFacts(id)),
    findings.length ? el("ul", { class: "findings" }, findings.map((f) => el("li", {}, el("span", { class: `badge ${f.level}` }, f.level), " ",
      f.message, f.line ? el("span", { class: "sub" }, ` line ${f.line}`) : null))) : null,
  ];
  const sub = `${skill.id} · ${skill.writable ? "project, editable" : `${skill.source}, read-only`}`;
  if (state.editing?.id === id) return showPanel({ key: `edit:${id}`, title: skill.name, sub, facts, ...editPage(skill) });
  const edit = skill.writable ? el("button", { class: "primary", onclick: () => { state.editing = { id, dirty: () => false }; openSkill(id); } }, "Edit") : null;
  showPanel({ key: `skill:${id}`, title: skill.name, sub, facts, actions: [edit], content: readPage(skill) });
}

const fileLine = (skill) => el("p", { class: "sub file" },
  `${skill.real_path} · ${skill.size} bytes · changed ${new Date(skill.modified).toLocaleString()}`);

function readPage(skill) {
  const description = skill.frontmatter?.description || "";
  const text = el("div", { class: "md" }, markdown(skill.body));
  markReferences(text, skill.id);
  return [
    part("Every turn", "The skill's listing: Claude reads it in every session to decide when to use the skill.",
      listingCost(skill.id, skill, description), listing(skill)),
    part("When it runs", "The rest of SKILL.md, loaded only when the skill is used.", `≈${skill.tokens.body} tokens`, text),
    skill.writable ? null : copyForm(skill),
    fileLine(skill),
  ];
}

// The same page as fields: name, description and the markdown text, saved as one task. The rest —
// changing it with Claude, skill-creator, adding a call, deleting — sits at its foot.
function editPage(skill) {
  const description = skill.frontmatter?.description || "";
  const name = el("input", { value: skill.name, "aria-label": "Name" });
  const desc = el("textarea", { rows: "6", "aria-label": "Description" }, description);
  const body = el("textarea", { class: "source", rows: "24", spellcheck: "false", "aria-label": "Text" }, skill.body);
  const count = el("span", {});
  const counted = () => {
    count.className = desc.value.length > DESCRIPTION_MAX ? "over" : "";
    count.textContent = `${desc.value.length} / ${DESCRIPTION_MAX} characters`;
  };
  desc.addEventListener("input", counted);
  counted();
  const grow = () => { body.style.height = "auto"; body.style.height = `${body.scrollHeight + 2}px`; };
  body.addEventListener("input", grow);
  requestAnimationFrame(grow);
  const dirty = () => name.value.trim() !== skill.name || desc.value !== description || body.value !== skill.body;
  state.editing = { id: skill.id, dirty };
  const stop = () => { state.editing = null; openSkill(skill.id); };
  const cancel = el("button", { onclick: () => (!dirty() || confirm("Drop your edits?")) && stop() }, "Cancel");
  const save = el("button", { class: "primary", onclick: async () => {
    if (!dirty()) return stop();
    if (await sendTask({ kind: "save", skill: skill.id, name: name.value, description: desc.value, body: body.value }, `save ${skill.id}`)) stop();
  } }, "Save");
  const fields = Object.entries(skill.frontmatter || {}).filter(([key]) => !["name", "description"].includes(key));
  return {
    actions: [cancel, save],
    content: [
      part("Every turn", "The skill's listing: Claude reads it in every session to decide when to use the skill.", count,
        el("div", { class: "fields" }, el("label", {}, "Name"), name, el("label", {}, "Description"), desc,
          fields.length ? el("p", { class: "sub" }, `Kept as they are: ${fields.map(([key]) => key).join(", ")}.`) : null)),
      part("When it runs", "The rest of SKILL.md, in markdown.", `≈${skill.tokens.body} tokens`, body),
      part("With Claude", "Sent to the session, which works on it with you in the chat.", "",
        ...changeForm(skill), ...improveForm(skill), el("label", {}, "Call another skill"), callPicker(skill)),
      deleteZone(skill),
      fileLine(skill),
    ],
  };
}

function usageFacts(id) {
  const used = usageOf(id);
  if (!used) return [el("span", { class: "sub" }, state.usage.status === "loading" ? "Fetching usage…" : "Not in the usage report")];
  return [
    el("span", {}, used.uses ? `${used.uses}× used · last ${used.last_used}` : "Never used"),
    used.tokens_7d ? el("span", {}, `${used.tokens_7d} tokens in 7 days`) : null,
  ];
}

// One of the two halves of a SKILL.md, under a divider naming when Claude reads it and what it costs.
function part(title, hint, cost, ...content) {
  return el("section", { class: "part" },
    el("div", { class: "part-rule" }, el("span", { class: "part-title" }, title), el("span", { class: "part-hint" }, hint),
      el("span", { class: "part-cost" }, cost)),
    ...content);
}

const DESCRIPTION_MAX = 1024;

function listingCost(id, skill, description) {
  const measured = usageOf(id)?.context;
  return [
    measured ? `${measured} tokens` : `≈${skill.tokens.listing} tokens`,
    " · ",
    el("span", { class: description.length > DESCRIPTION_MAX ? "over" : "" }, `${description.length} / ${DESCRIPTION_MAX} characters`),
  ];
}

// The frontmatter: the description as text, the other fields small beneath it.
function listing(skill) {
  const fields = Object.entries(skill.frontmatter || {}).filter(([key]) => !["name", "description"].includes(key));
  const shown = (value) => typeof value === "string" ? value : JSON.stringify(value);
  return el("div", { class: "md listing" },
    el("p", { class: "description" }, skill.frontmatter?.description || el("em", {}, "No description: Claude cannot tell when to use it.")),
    fields.length ? el("dl", {}, fields.flatMap(([key, value]) => [el("dt", {}, key), el("dd", {}, el("code", {}, shown(value)))])) : null);
}

function changeForm(skill) {
  const change = el("textarea", { rows: "3", placeholder: "e.g. Extract the git handling into its own skill and call it from here." });
  return [
    el("label", {}, "Change it with Claude"), change,
    el("div", { class: "row" }, el("button", { onclick: () => change.value.trim() &&
      sendTask({ kind: "change", skill: skill.id, text: change.value }, `change ${skill.id}`) }, "Send to Claude")),
  ];
}

function improveForm(skill) {
  const focus = el("input", { placeholder: "Optional: e.g. make the description trigger better" });
  return [
    el("label", {}, "Improve with skill-creator"), focus,
    el("div", { class: "row" }, el("button", { onclick: () =>
      sendTask({ kind: "improve", skill: skill.id, focus: focus.value.trim() }, `improve ${skill.id}`) }, "Improve")),
  ];
}

function deleteZone(skill) {
  const callers = wiresTo(skill.id).map((w) => w.from);
  const ask = () => {
    const named = callers.length ? `\n\nNamed by: ${callers.join(", ")}. Claude will ask whether to remove those mentions too.` : "";
    if (confirm(`Delete ${skill.id}?${named}`)) sendTask({ kind: "delete", skill: skill.id }, `delete ${skill.id}`);
  };
  return el("div", { class: "danger-zone" }, el("div", { class: "row" },
    el("span", { class: "sub" }, callers.length ? `Named by ${callers.length} skill${callers.length === 1 ? "" : "s"}.` : "Nothing names it."),
    el("button", { class: "danger", onclick: ask }, "Delete skill")));
}

function copyForm(skill) {
  const name = el("input", { value: `${skill.name}-copy`, "aria-label": "New name" });
  return part("Copy", "Read-only here. A copy becomes the project's own skill, under a new name.", "",
    el("div", { class: "inline-form" }, name, el("button", { onclick: () =>
      sendTask({ kind: "copy", source: skill.id, name: name.value.trim() }, `copy ${skill.id} as ${name.value.trim()}`) }, "Copy as template")));
}

$("new-skill").addEventListener("click", () => {
  state.selected = null;
  drawCards();
  const name = el("input", { placeholder: "git-finish" });
  const description = el("textarea", { rows: "4", placeholder: "What it does, and when to use it." });
  const intent = el("textarea", { rows: "4", placeholder: "Anything Claude should know when writing it." });
  showPanel({ key: "new", title: "New skill", sub: "Claude writes it with you in the chat.", content: el("div", { class: "fields" },
    el("label", {}, "Name"), name, el("label", {}, "Description"), description, el("label", {}, "Intent"), intent,
    el("div", { class: "row" }, el("button", { class: "primary", onclick: () => sendTask(
      { kind: "new", name: name.value.trim(), description: description.value, intent: intent.value }, `write ${name.value.trim()}`) },
      "Send to Claude"))) });
});

$("analyse").addEventListener("click", () => sendTask({ kind: "analyse" }, "analyse this project's skills"));

$("close-studio").addEventListener("click", async () => {
  const waiting = state.tasks.length;
  const warning = waiting ? `\n\n${waiting} task${waiting === 1 ? "" : "s"} not done yet will stay in the inbox for next time.` : "";
  if (!confirm(`Close the studio? Claude stops watching for tasks and the server stops.${warning}`)) return;
  try {
    await api("/close", {});
  } catch (error) {
    return toast(`Not closed: ${error.message}`);
  }
  clearInterval(state.poller);
  document.body.replaceChildren(el("main", { class: "closed" },
    el("div", {}, el("h1", {}, "Skills Studio is closed"),
      el("p", {}, "Claude has been told and stops watching for tasks. You can close this tab."),
      el("p", { class: "sub" }, "Run /skills-studio again to reopen it."))));
});

// ---- load and keep current -----------------------------------------------------------------

function drawHeader() {
  $("project").textContent = state.graph.project;
  $("project").title = state.graph.project;
  const count = (level) => state.graph.findings.filter((f) => f.level === level).length;
  const active = state.tasks.filter((t) => t.state === "active").length;
  const waiting = state.tasks.length - active;
  const open = unjudged();
  $("analyse").title = open ? `${open} wires not yet judged call or mention; Analyse has Claude judge them`
    : "Every wire is judged call or mention";
  $("counts").replaceChildren(el("span", {},
    el("span", {}, `${state.graph.skills.filter((s) => s.source === "project").length} project skills`),
    state.tasks.length ? el("span", { title: "Tasks for the Claude session" },
      ` · ${[active && `${active} in progress`, waiting && `${waiting} waiting`].filter(Boolean).join(", ")}`) : null),
    ...["error", "warning", "info"].filter((level) => count(level)).map((level) => el("span", { class: `badge ${level}` }, `${count(level)} ${level}`)));
}

function drawUsageButton() {
  const { status, fetched_at: at, error } = state.usage;
  const button = $("usage");
  button.disabled = status === "loading";
  button.textContent = { loading: "Fetching usage…", failed: "Usage failed — retry" }[status] || "Refresh usage";
  button.title = status === "failed" ? `From /skill-doctor: ${error}`
    : at ? `Usage from /skill-doctor, fetched ${new Date(at).toLocaleString()}` : "Fetch usage from /skill-doctor";
}

$("usage").addEventListener("click", async () => {
  try {
    state.usage = await api("/usage", {});
  } catch (error) {
    return toast(`Usage not fetched: ${error.message}`);
  }
  drawUsageButton();
});

async function refresh(force = false) {
  let graph, inFlight, usage;
  try {
    [graph, inFlight, usage] = await Promise.all([api("/graph"), api("/tasks"), api("/usage")]);
  } catch (error) {
    return toast(`Cannot reach the studio: ${error.message}`);
  }
  state.usage = usage;
  drawUsageButton();
  const next = signature(graph) + JSON.stringify(inFlight.tasks.map((t) => [t.id, t.state])) + usage.fetched_at;
  if (!force && next === state.signature) return;
  state.graph = graph;
  state.tasks = inFlight.tasks;
  state.signature = next;
  drawHeader();
  drawPalette();
  drawCards();
  const typing = $("panel").contains(document.activeElement) && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (state.selected && !typing && !state.editing) openSkill(state.selected);
}

(async () => {
  await refresh(true);
  state.poller = setInterval(() => document.visibilityState === "visible" && refresh(), POLL_MS);
})();
</script>
